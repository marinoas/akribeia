<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1040" width="1520" height="1040" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="aS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e0a800"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
    <marker id="aD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1520" height="1040" fill="#fff"/>
  <text x="40" y="44" font-size="26" font-weight="bold" fill="#222">Βάση πειράματος: φακός Fresnel + κελί CPV + υδρόψυξη</text>
  <text x="40" y="72" font-size="15" fill="#555">Πλάγια όψη · όλη η βάση γέρνει ώστε ο φακός να κοιτά κάθετα τον ήλιο</text>

  <!-- sun rays -->
  <g stroke="#e0a800" stroke-width="2.5">
    <line x1="330" y1="100" x2="330" y2="215" marker-end="url(#aS)"/>
    <line x1="420" y1="100" x2="420" y2="215" marker-end="url(#aS)"/>
    <line x1="510" y1="100" x2="510" y2="215" marker-end="url(#aS)"/>
    <line x1="600" y1="100" x2="600" y2="215" marker-end="url(#aS)"/>
  </g>
  <text x="640" y="140" font-size="14" fill="#a07700">ήλιος (κάθετα στον φακό)</text>

  <!-- threaded rods -->
  <line x1="270" y1="200" x2="270" y2="760" stroke="#777" stroke-width="7"/>
  <line x1="660" y1="200" x2="660" y2="760" stroke="#777" stroke-width="7"/>
  <text x="680" y="470" font-size="13" fill="#555">ντίζες M8 × 50 cm</text>
  <text x="680" y="486" font-size="13" fill="#555">(4 τεμ., στις γωνίες)</text>

  <!-- lens frame -->
  <rect x="255" y="220" width="420" height="22" rx="4" fill="#d9c7a5" stroke="#8a6d3b" stroke-width="2"/>
  <rect x="285" y="226" width="360" height="10" fill="#cfe8ff" stroke="#2a78d6" stroke-width="1.5"/>
  <g fill="#8a6d3b"><rect x="258" y="210" width="24" height="10"/><rect x="648" y="210" width="24" height="10"/><rect x="258" y="242" width="24" height="10"/><rect x="648" y="242" width="24" height="10"/></g>
  <text x="700" y="232" font-size="15" font-weight="bold" fill="#1d5fae">ΦΑΚΟΣ FRESNEL ~25×25 cm</text>
  <text x="700" y="252" font-size="12" fill="#333">σε ξύλινο τελάρο · οι ραβδώσεις προς τα κάτω (προς το κελί)</text>
  <text x="700" y="268" font-size="12" fill="#333">παξιμάδια πάνω-κάτω: ανεβοκατεβάζεις για να ρυθμίσεις την κηλίδα</text>

  <!-- converging cone -->
  <polygon points="285,242 645,242 472,640 458,640" fill="#ffe680" opacity="0.45"/>
  <line x1="285" y1="242" x2="458" y2="640" stroke="#e0a800" stroke-width="1.5"/>
  <line x1="645" y1="242" x2="472" y2="640" stroke="#e0a800" stroke-width="1.5"/>

  <!-- focal distance dimension -->
  <line x1="200" y1="236" x2="200" y2="650" stroke="#333" stroke-width="1.5" marker-start="url(#aD)" marker-end="url(#aD)"/>
  <text x="70" y="440" font-size="14" font-weight="bold" fill="#333">εστιακή</text>
  <text x="70" y="458" font-size="14" font-weight="bold" fill="#333">απόσταση</text>
  <text x="70" y="476" font-size="13" fill="#333">~25–35 cm</text>
  <text x="70" y="494" font-size="12" fill="#666">(βρίσκεται με</text>
  <text x="70" y="510" font-size="12" fill="#666">δοκιμή σε ξύλο)</text>

  <!-- heat shield -->
  <rect x="380" y="622" width="72" height="8" fill="#c9ced4" stroke="#555"/>
  <rect x="478" y="622" width="72" height="8" fill="#c9ced4" stroke="#555"/>
  <text x="565" y="618" font-size="13" font-weight="bold" fill="#444">ΑΣΠΙΔΑ αλουμινίου με τρύπα 1 cm</text>
  <text x="565" y="634" font-size="12" fill="#444">προστατεύει καλώδια και άκρα του κελιού</text>

  <!-- cell + copper + pad + block -->
  <rect x="455" y="648" width="20" height="4" fill="#111"/>
  <rect x="430" y="652" width="70" height="10" fill="#d4874b" stroke="#8a4b1d"/>
  <rect x="425" y="662" width="80" height="5" fill="#9fb7c9"/>
  <rect x="415" y="667" width="100" height="38" rx="4" fill="#b8c4d0" stroke="#555" stroke-width="2"/>
  <text x="565" y="654" font-size="13" font-weight="bold" fill="#111">κελί CPV 1 cm²</text>
  <text x="565" y="672" font-size="12" fill="#8a4b1d">χάλκινη πλάκα 4×4 cm (+) · κόλλα ασημιού</text>
  <text x="565" y="688" font-size="12" fill="#4a6a82">θερμικό pad (δεν άγει ρεύμα)</text>
  <text x="565" y="704" font-size="12" fill="#333">μπλοκ υδρόψυξης PC</text>
  

  <!-- receiver stand -->
  <rect x="440" y="705" width="50" height="55" fill="#d9c7a5" stroke="#8a6d3b"/>

  <!-- base board -->
  <rect x="230" y="760" width="470" height="22" fill="#c9a26b" stroke="#8a6d3b" stroke-width="2"/>
  <text x="345" y="815" font-size="13" fill="#6b4f22">κόντρα πλακέ 50×50 cm</text>
  <!-- hinge + tilt -->
  <circle cx="240" cy="790" r="9" fill="#777"/>
  <polygon points="240,790 700,782 700,860 240,860" fill="none" stroke="#999" stroke-dasharray="6,4"/>
  <rect x="690" y="782" width="14" height="80" fill="#999"/>
  <text x="712" y="815" font-size="12" fill="#555">ρυθμιζόμενο ύψος =</text>
  <text x="712" y="831" font-size="12" fill="#555">κλίση προς τον ήλιο</text>
  <rect x="200" y="860" width="540" height="16" fill="#8a7a5a"/>
  <text x="345" y="900" font-size="13" fill="#555">κάτω βάση πάνω σε «περιστρεφόμενο δίσκο» (lazy susan): γυρίζεις ανατολή → δύση</text>

  <!-- aiming gnomon -->
  <line x1="620" y1="760" x2="620" y2="725" stroke="#222" stroke-width="3"/>
  <text x="628" y="730" font-size="11" fill="#222">καρφί</text>

  <!-- water loop -->
  <polyline points="415,690 330,690 330,960 900,960" fill="none" stroke="#2a78d6" stroke-width="4" marker-end="url(#aB)"/>
  <polyline points="900,990 300,990 300,680 415,680" fill="none" stroke="#2a78d6" stroke-width="4" stroke-dasharray="10,5" marker-end="url(#aB)"/>
  <rect x="900" y="930" width="190" height="80" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="910" y="955" font-size="13" font-weight="bold" fill="#1d5fae">ΑΝΤΛΙΑ + ΔΟΧΕΙΟ</text>
  <text x="910" y="973" font-size="12" fill="#333">(ή ψυγείο PC)</text>
  <text x="910" y="991" font-size="12" fill="#333">ανοίγει ΠΡΙΝ τον ήλιο</text>

  <!-- electrical -->
  <polyline points="500,657 530,657 530,740 860,740 860,570 900,570" fill="none" stroke="#c0392b" stroke-width="4"/>
  <polyline points="475,650 545,650 545,750 880,750 880,595 900,595" fill="none" stroke="#222" stroke-width="4"/>
  <rect x="900" y="520" width="200" height="90" rx="8" fill="#fdeeee" stroke="#c0392b" stroke-width="2"/>
  <text x="910" y="545" font-size="13" font-weight="bold" fill="#a93226">ΜΕΤΡΗΤΗΣ DC</text>
  <text x="910" y="563" font-size="12" fill="#333">τάση · ρεύμα (έως 10 A) · W</text>
  <text x="910" y="581" font-size="12" fill="#333">καλώδια 2,5 mm²</text>
  <line x1="1100" y1="565" x2="1160" y2="565" stroke="#c0392b" stroke-width="4"/>
  <rect x="1160" y="535" width="150" height="60" rx="6" fill="#eef1f4" stroke="#555" stroke-width="2"/>
  <text x="1170" y="560" font-size="12" font-weight="bold" fill="#333">ΑΝΤΙΣΤΑΣΗ</text>
  <text x="1170" y="578" font-size="12" fill="#333">0,33 Ω / 50 W</text>
  <text x="1160" y="615" font-size="11" fill="#666">σε ψύκτρα: ζεσταίνεται!</text>

  <!-- thermometer -->
  <rect x="900" y="660" width="200" height="70" rx="8" fill="#f5eefa" stroke="#7d3c98" stroke-width="2"/>
  <text x="910" y="685" font-size="13" font-weight="bold" fill="#7d3c98">ΘΕΡΜΟΜΕΤΡΟ 2 αισθητήρες</text>
  <text x="910" y="703" font-size="12" fill="#333">1: χάλκινη πλάκα (&lt; 70°C)</text>
  <text x="910" y="719" font-size="12" fill="#333">2: νερό επιστροφής</text>
  <line x1="900" y1="695" x2="505" y2="660" stroke="#7d3c98" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- notes -->
  <rect x="1150" y="90" width="340" height="390" rx="10" fill="#fff" stroke="#c9ced4"/>
  <text x="1162" y="116" font-size="15" font-weight="bold" fill="#222">Πώς στοχεύεις με το χέρι</text>
  <text x="1162" y="142" font-size="12" fill="#333">1. Το καρφί είναι κάθετο στη βάση.</text>
  <text x="1162" y="160" font-size="12" fill="#333">2. Γυρίζεις τον δίσκο και αλλάζεις</text>
  <text x="1162" y="176" font-size="12" fill="#333">   την κλίση μέχρι να ΧΑΘΕΙ η σκιά</text>
  <text x="1162" y="192" font-size="12" fill="#333">   του καρφιού: τότε ο φακός κοιτά</text>
  <text x="1162" y="208" font-size="12" fill="#333">   ακριβώς τον ήλιο.</text>
  <text x="1162" y="226" font-size="12" fill="#333">3. Διόρθωση κάθε 1–2 λεπτά.</text>
  <text x="1162" y="256" font-size="15" font-weight="bold" fill="#222">Σειρά δοκιμής</text>
  <text x="1162" y="280" font-size="12" fill="#333">• αντλία ON</text>
  <text x="1162" y="298" font-size="12" fill="#333">• φακός ψηλά: μεγάλη κηλίδα</text>
  <text x="1162" y="316" font-size="12" fill="#333">• κατεβάζεις λίγο-λίγο με τα παξιμάδια</text>
  <text x="1162" y="334" font-size="12" fill="#333">• σε κάθε βήμα: V, A, W, °C</text>
  <text x="1162" y="352" font-size="12" fill="#333">• πλάκα &gt; 70°C → σταμάτα</text>
  <text x="1162" y="382" font-size="15" font-weight="bold" fill="#c0392b">Ασφάλεια</text>
  <text x="1162" y="406" font-size="12" fill="#333">• γυαλιά συγκόλλησης (σκίαση 5–8)</text>
  <text x="1162" y="424" font-size="12" fill="#333">• εκτός χρήσης: σκέπασε τον φακό</text>
  <text x="1162" y="442" font-size="12" fill="#333">• τίποτα εύφλεκτο κοντά στην εστία</text>
  <text x="1162" y="460" font-size="12" fill="#333">• στόχος: ~15–20 W από το κελί</text>
</svg>
