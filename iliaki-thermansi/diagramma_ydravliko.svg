<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1010" width="1520" height="1010" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="aH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/>
    </marker>
    <marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/>
    </marker>
    <pattern id="ins" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ecebe6"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#c9c7c0" stroke-width="2"/>
    </pattern>
    <style>
      .t  { font-size: 13px; fill: #0b0b0b; }
      .ts { font-size: 11.5px; fill: #52514e; }
      .tb { font-size: 14px; font-weight: bold; fill: #0b0b0b; }
      .tz { font-size: 13px; font-weight: bold; fill: #8a8984; letter-spacing: 0.5px; }
      .eq { fill: #f3f2ee; stroke: #52514e; stroke-width: 1.6; }
      .hw { fill: none; stroke: #eb6834; stroke-width: 4; }
      .cw { fill: none; stroke: #2a78d6; stroke-width: 4; }
      .ha { fill: none; stroke: #eb6834; stroke-width: 3; stroke-dasharray: 10 6; }
      .ca { fill: none; stroke: #2a78d6; stroke-width: 3; stroke-dasharray: 10 6; }
      .ray { stroke: #e3b23c; stroke-width: 1.4; }
      .sens { fill: #fcfcfb; stroke: #0b0b0b; stroke-width: 1.3; }
    </style>
  </defs>

  <rect width="1520" height="1010" fill="#fcfcfb"/>

  <!-- Τίτλος -->
  <text x="30" y="38" class="tb" style="font-size:20px">Υβριδική ηλιακή θέρμανση: κάτοπτρο → αποθήκη άμμου → καταρράκτης → καλοριφέρ</text>
  <text x="30" y="62" class="ts">Σχηματικό λειτουργίας (όχι κατασκευαστικό). Οι υπάρχοντες λέβητας, δεξαμενή και καλοριφέρ μένουν στη θέση τους.</text>

  <!-- Ζώνες -->
  <rect x="20" y="80" width="740" height="600" rx="10" fill="#f6f5f1" stroke="#e6e5e0"/>
  <text x="34" y="102" class="tz">ΑΕΡΑΣ + ΑΜΜΟΣ · νέα κατασκευή · έως 550°C · χωρίς πίεση</text>
  <rect x="770" y="80" width="730" height="600" rx="10" fill="#f2f6fb" stroke="#e1e9f3"/>
  <text x="784" y="668" class="tz">ΝΕΡΟ · δουλειά υδραυλικού · έως ~85°C · κλειστό κύκλωμα</text>

  <!-- Ήλιος και ακτίνες -->
  <circle cx="80" cy="150" r="22" fill="#f2c14e"/>
  <line class="ray" x1="98" y1="166" x2="150" y2="300"/>
  <line class="ray" x1="102" y1="160" x2="230" y2="292"/>
  <line class="ray" x1="150" y1="300" x2="200" y2="210"/>
  <line class="ray" x1="230" y1="292" x2="204" y2="212"/>
  <line class="ray" x1="190" y1="318" x2="202" y2="212"/>

  <!-- Κάτοπτρο -->
  <path d="M110,262 Q200,372 290,262" fill="none" stroke="#52514e" stroke-width="5"/>
  <line x1="200" y1="318" x2="200" y2="420" stroke="#52514e" stroke-width="4"/>
  <rect x="175" y="420" width="50" height="16" class="eq"/>
  <text x="120" y="458" class="t">Κάτοπτρο σημειακής εστίασης</text>
  <text x="120" y="475" class="ts">π.χ. 40 m², παρακολούθηση 2 αξόνων</text>
  <!-- Δέκτης -->
  <rect x="180" y="180" width="44" height="32" rx="4" class="eq" style="fill:#3a3936"/>
  <text x="232" y="176" class="t">Δέκτης</text>
  <text x="232" y="192" class="ts">(κοιλότητα)</text>

  <!-- Κύκλωμα αέρα 1: φόρτιση -->
  <path class="ha" d="M224,196 H500 V250" marker-end="url(#aH)"/>
  <text x="300" y="216" class="ts">ζεστός αέρας 550-600°C</text>
  <path class="ca" d="M470,640 H70 V196 H178" marker-end="url(#aC)"/>
  <circle cx="250" cy="640" r="15" class="eq"/>
  <path d="M242,632 L258,648 M258,632 L242,648" stroke="#52514e" stroke-width="1.5"/>
  <text x="200" y="672" class="t">Α1</text>
  <text x="224" y="672" class="ts">ανεμιστήρας φόρτισης</text>
  <text x="90" y="600" class="ts">ψυχρότερος αέρας επιστρέφει στον δέκτη</text>

  <!-- Αποθήκη άμμου -->
  <rect x="436" y="236" width="228" height="430" rx="22" fill="url(#ins)" stroke="#52514e" stroke-width="1.6"/>
  <rect x="460" y="258" width="180" height="386" rx="14" fill="#e9d9b5" stroke="#52514e" stroke-width="1.2"/>
  <text x="550" y="400" class="tb" text-anchor="middle">ΑΠΟΘΗΚΗ</text>
  <text x="550" y="420" class="tb" text-anchor="middle">ΑΜΜΟΥ</text>
  <text x="550" y="444" class="t" text-anchor="middle">~3 m³ · έως 550°C</text>
  <text x="550" y="466" class="ts" text-anchor="middle">σωλήνες αέρα μέσα</text>
  <text x="550" y="482" class="ts" text-anchor="middle">στην άμμο</text>
  <text x="428" y="530" class="ts" text-anchor="end">μόνωση κενού</text>
  <text x="428" y="545" class="ts" text-anchor="end">με περλίτη</text>
  <text x="428" y="560" class="ts" text-anchor="end">(γραμμοσκίαση)</text>
  <circle cx="470" cy="560" r="11" class="sens"/><text x="470" y="564" font-size="10" text-anchor="middle">Τ1</text>

  <!-- Κύκλωμα αέρα 2: εκφόρτιση -->
  <path class="ha" d="M640,330 H700 V170 H776" marker-end="url(#aH)"/>
  <path class="ha" d="M700,330 V462 H776" marker-end="url(#aH)"/>
  <circle cx="700" cy="330" r="5" fill="#eb6834"/>
  <text x="708" y="352" class="ts">ζεστός αέρας</text>
  <!-- επιστροφή από αντλία απορρόφησης -->
  <path class="ca" d="M870,108 V88 H560 V254" marker-end="url(#aC)"/>
  <circle cx="720" cy="88" r="14" class="eq"/>
  <path d="M712,80 L728,96 M728,80 L712,96" stroke="#52514e" stroke-width="1.5"/>
  <text x="608" y="128" class="t">Α2</text>
  <text x="608" y="144" class="ts">+ κλαπέτο αντεπιστροφής</text>
  <!-- επιστροφή από εναλλάκτη -->
  <path class="ca" d="M870,524 V610 H666" marker-end="url(#aC)"/>
  <circle cx="760" cy="610" r="14" class="eq"/>
  <path d="M752,602 L768,618 M768,602 L752,618" stroke="#52514e" stroke-width="1.5"/>
  <text x="680" y="644" class="t">Α3</text>
  <text x="704" y="644" class="ts">+ κλαπέτο</text>

  <!-- Αντλία απορρόφησης -->
  <rect x="780" y="110" width="180" height="140" rx="8" class="eq"/>
  <text x="870" y="140" class="tb" text-anchor="middle">ΑΝΤΛΙΑ</text>
  <text x="870" y="158" class="tb" text-anchor="middle">ΑΠΟΡΡΟΦΗΣΗΣ</text>
  <text x="870" y="178" class="ts" text-anchor="middle">NH₃-H₂O, εξωτερικός χώρος</text>
  <text x="870" y="196" class="ts" text-anchor="middle">ο καυστήρας αντικαθίσταται</text>
  <text x="870" y="211" class="ts" text-anchor="middle">από τον ζεστό αέρα της άμμου</text>
  <text x="870" y="236" class="t" text-anchor="middle">δίνει νερό ~55°C</text>
  <path d="M930,300 V256" fill="none" stroke="#8a8984" stroke-width="2" marker-end="url(#aG)"/>
  <text x="784" y="276" class="ts">+ θερμότητα από τον</text>
  <text x="784" y="291" class="ts">έξω αέρα (δωρεάν)</text>

  <!-- Εναλλάκτης αέρα-νερού -->
  <rect x="780" y="420" width="180" height="104" rx="8" class="eq"/>
  <text x="870" y="448" class="tb" text-anchor="middle">ΕΝΑΛΛΑΚΤΗΣ</text>
  <text x="870" y="466" class="tb" text-anchor="middle">ΑΕΡΑ-ΝΕΡΟΥ</text>
  <text x="870" y="486" class="ts" text-anchor="middle">απευθείας θέρμανση</text>
  <text x="870" y="510" class="t" text-anchor="middle">δίνει νερό έως ~85°C</text>

  <!-- Κύκλωμα φόρτισης νερού (σε σειρά) -->
  <path class="cw" d="M1056,500 H962" marker-end="url(#aC)"/>
  <circle cx="1012" cy="500" r="13" class="eq"/>
  <path d="M1006,493 L1020,500 L1006,507 z" fill="#52514e"/>
  <text x="998" y="532" class="t">Κ2</text>
  <path class="hw" d="M960,440 H990 V230 H962" marker-end="url(#aH)" style="stroke-width:3.2;opacity:0.75"/>
  <path class="hw" d="M960,140 H1020 V176 H1054" marker-end="url(#aH)"/>

  <!-- Δεξαμενή buffer (παλιά δεξαμενή πετρελαίου) -->
  <rect x="1060" y="150" width="120" height="380" rx="16" fill="url(#ins)" stroke="#52514e" stroke-width="1.6"/>
  <rect x="1072" y="162" width="96" height="356" rx="10" fill="#fbe3d7" stroke="#52514e" stroke-width="1"/>
  <rect x="1072" y="400" width="96" height="118" rx="10" fill="#dbe8f8"/>
  <text x="1120" y="290" class="tb" text-anchor="middle">ΔΕΞΑΜΕΝΗ</text>
  <text x="1120" y="308" class="tb" text-anchor="middle">1 m³</text>
  <text x="1120" y="328" class="ts" text-anchor="middle">η παλιά του</text>
  <text x="1120" y="343" class="ts" text-anchor="middle">πετρελαίου,</text>
  <text x="1120" y="358" class="ts" text-anchor="middle">καθαρισμένη,</text>
  <text x="1120" y="373" class="ts" text-anchor="middle">μονωμένη</text>
  <text x="1120" y="420" class="ts" text-anchor="middle">ψυχρό κάτω</text>
  <text x="1120" y="190" class="ts" text-anchor="middle">ζεστό πάνω</text>
  <circle cx="1166" cy="210" r="11" class="sens"/><text x="1166" y="214" font-size="10" text-anchor="middle">Τ2</text>
  <circle cx="1166" cy="480" r="11" class="sens"/><text x="1166" y="484" font-size="10" text-anchor="middle">Τ3</text>
  <!-- εξαεριστικό & ασφαλιστική -->
  <line x1="1100" y1="150" x2="1100" y2="128" stroke="#52514e" stroke-width="2"/>
  <rect x="1093" y="118" width="14" height="10" class="eq"/>
  <text x="1060" y="112" class="ts">εξαεριστικό · βαλβίδα ασφαλείας 3 bar</text>

  <!-- Προς καλοριφέρ -->
  <path class="hw" d="M1180,186 H1240"/>
  <!-- τρίοδη βάνα -->
  <path d="M1240,176 L1258,186 L1240,196 z M1276,176 L1258,186 L1276,196 z M1248,204 L1258,186 L1268,204 z" fill="#f3f2ee" stroke="#0b0b0b" stroke-width="1.3"/>
  <text x="1232" y="168" class="t">Β1</text>
  <path class="hw" d="M1276,186 H1414" marker-end="url(#aH)"/>
  <path class="hw" d="M1258,204 V268"/>
  <!-- λέβητας -->
  <rect x="1218" y="268" width="120" height="96" rx="8" class="eq"/>
  <text x="1278" y="300" class="tb" text-anchor="middle">ΛΕΒΗΤΑΣ</text>
  <text x="1278" y="318" class="ts" text-anchor="middle">υπάρχων,</text>
  <text x="1278" y="333" class="ts" text-anchor="middle">μόνο ως ενισχυτής</text>
  <text x="1278" y="350" class="ts" text-anchor="middle">(σε σειρά)</text>
  <path class="hw" d="M1310,268 V230 H1350 V190"/>
  <circle cx="1350" cy="186" r="5" fill="#eb6834"/>
  <circle cx="1390" cy="186" r="13" class="eq"/>
  <path d="M1384,179 L1398,186 L1384,193 z" fill="#52514e"/>
  <text x="1378" y="218" class="t">Κ1</text>
  <line x1="1370" y1="171" x2="1370" y2="184" stroke="#0b0b0b" stroke-width="1.3"/><circle cx="1370" cy="160" r="11" class="sens"/><text x="1370" y="164" font-size="10" text-anchor="middle">Τ4</text>

  <!-- Καλοριφέρ -->
  <g transform="translate(1420,140)">
    <rect x="0" y="0" width="64" height="86" rx="4" class="eq"/>
    <line x1="10" y1="6" x2="10" y2="80" stroke="#52514e" stroke-width="2"/>
    <line x1="22" y1="6" x2="22" y2="80" stroke="#52514e" stroke-width="2"/>
    <line x1="34" y1="6" x2="34" y2="80" stroke="#52514e" stroke-width="2"/>
    <line x1="46" y1="6" x2="46" y2="80" stroke="#52514e" stroke-width="2"/>
    <line x1="56" y1="6" x2="56" y2="80" stroke="#52514e" stroke-width="2"/>
  </g>
  <text x="1452" y="128" class="tb" text-anchor="middle">ΚΑΛΟΡΙΦΕΡ</text>
  <text x="1460" y="300" class="ts" text-anchor="end">τα υπάρχοντα</text>
  <path class="cw" d="M1470,226 V580 H1200 V500 H1182" marker-end="url(#aC)"/>
  <text x="1260" y="602" class="ts">επιστροφή ~40-50°C</text>
  <!-- δοχείο διαστολής -->
  <line x1="1330" y1="580" x2="1330" y2="548" stroke="#52514e" stroke-width="2"/>
  <ellipse cx="1330" cy="530" rx="22" ry="18" class="eq"/>
  <text x="1360" y="526" class="ts">δοχείο</text>
  <text x="1360" y="541" class="ts">διαστολής</text>

  <!-- Λογική λειτουργίας -->
  <rect x="20" y="700" width="900" height="290" rx="10" fill="#fcfcfb" stroke="#e6e5e0"/>
  <text x="38" y="728" class="tb">Λογική λειτουργίας (ένας απλός ελεγκτής με 5 αισθητήρες: Τ1-Τ4 + εξωτερική θερμοκρασία)</text>
  <text x="38" y="758" class="t"><tspan font-weight="bold">Φόρτιση:</tspan> όταν έχει ήλιο και Τ1 &lt; 550°C, δουλεύουν το κάτοπτρο και ο ανεμιστήρας Α1. Τη νύχτα κλείνει το στόμιο του δέκτη.</text>
  <text x="38" y="790" class="t"><tspan font-weight="bold">Όταν το σπίτι θέλει θέρμανση και η δεξαμενή (Τ2) πέσει κάτω από τον στόχο:</tspan></text>
  <text x="56" y="814" class="t">1. Άμμος (Τ1) πάνω από 200°C → τρέχει ο Α2 → <tspan font-weight="bold">αντλία απορρόφησης</tspan>: ~1,3-1,6 kWh θέρμανσης ανά kWh άμμου.</text>
  <text x="56" y="838" class="t">2. Άμμος 65-200°C → τρέχει ο Α3 → <tspan font-weight="bold">εναλλάκτης</tspan>: απευθείας θέρμανση, νερό έως ~85°C.</text>
  <text x="56" y="862" class="t">3. Άμμος κάτω από 65°C → δεν δίνει πια, αναλαμβάνει ο λέβητας.</text>
  <text x="38" y="894" class="t"><tspan font-weight="bold">Προς τα καλοριφέρ:</tspan> η Κ1 τραβάει νερό από την κορυφή της δεξαμενής. Αν το νερό (Τ4) είναι αρκετά ζεστό για τον καιρό,</text>
  <text x="38" y="914" class="t">η Β1 παρακάμπτει τον λέβητα. Αν όχι, το νερό περνά από τον λέβητα, που το ανεβάζει μόνο όσους βαθμούς λείπουν.</text>
  <text x="38" y="946" class="ts">Οι Α2 και Α3 δεν τρέχουν ποτέ μαζί. Τα κλαπέτα αντεπιστροφής εμποδίζουν τη ροή από το κλάδο που δεν λειτουργεί.</text>
  <text x="38" y="966" class="ts">Η Κ2 τρέχει όποτε δουλεύει η αντλία απορρόφησης ή ο εναλλάκτης. Το νερό περνά και από τα δύο σε σειρά.</text>

  <!-- Υπόμνημα -->
  <rect x="940" y="700" width="560" height="290" rx="10" fill="#fcfcfb" stroke="#e6e5e0"/>
  <text x="958" y="728" class="tb">Υπόμνημα</text>
  <line class="hw" x1="960" y1="756" x2="1020" y2="756"/><text x="1034" y="760" class="t">Ζεστό νερό (προσαγωγή)</text>
  <line class="cw" x1="960" y1="784" x2="1020" y2="784"/><text x="1034" y="788" class="t">Ψυχρό νερό (επιστροφή)</text>
  <line class="ha" x1="960" y1="812" x2="1020" y2="812"/><text x="1034" y="816" class="t">Ζεστός αέρας (σε μονωμένο αγωγό)</text>
  <line class="ca" x1="960" y1="840" x2="1020" y2="840"/><text x="1034" y="844" class="t">Ψυχρότερος αέρας επιστροφής</text>
  <circle cx="990" cy="872" r="12" class="eq"/><path d="M984,865 L998,872 L984,879 z" fill="#52514e"/>
  <text x="1034" y="876" class="t">Κ = κυκλοφορητής νερού</text>
  <circle cx="990" cy="904" r="12" class="eq"/><path d="M983,897 L997,911 M997,897 L983,911" stroke="#52514e" stroke-width="1.5"/>
  <text x="1034" y="908" class="t">Α = ανεμιστήρας αέρα</text>
  <path d="M976,926 L990,934 L976,942 z M1004,926 L990,934 L1004,942 z" fill="#f3f2ee" stroke="#0b0b0b" stroke-width="1.2"/>
  <text x="1034" y="938" class="t">Β = τρίοδη βάνα</text>
  <circle cx="990" cy="964" r="11" class="sens"/><text x="990" y="968" font-size="10" text-anchor="middle">Τ</text>
  <text x="1034" y="968" class="t">αισθητήρας θερμοκρασίας</text>
</svg>
